version: 2
jobs:
  build:
    docker:
      - image: 218546966473.dkr.ecr.us-east-1.amazonaws.com/circle-ci:stitch-tap-tester-uv
    steps:
      - checkout
      - run:
          name: 'Setup virtual env'
          command: |
            uv venv --python 3.12 /usr/local/share/virtualenvs/tap-surveymonkey
            source /usr/local/share/virtualenvs/tap-surveymonkey/bin/activate
            uv pip install -U pip setuptools
            uv pip install .[dev]
      - run:
          name: 'pylint'
          command: |
            source /usr/local/share/virtualenvs/tap-surveymonkey/bin/activate
            pylint tap_surveymonkey -d C,R,W
      - run:
          name: 'Unit Tests'
          command: |
            source /usr/local/share/virtualenvs/tap-surveymonkey/bin/activate
            uv pip install pytest parameterized coverage
            coverage run -m pytest tests/unittests

workflows:
  version: 2
  commit:
    jobs:
      - build:
          context: circleci-user
