version: 2.1
jobs:
  build:
    docker:
      - image: 218546966473.dkr.ecr.us-east-1.amazonaws.com/circle-ci:stitch-tap-tester-uv
    steps:
      - checkout
      - run:
          name: 'Setup virtual env'
          command: |
            uv venv --python 3.12 /usr/local/share/virtualenvs/tap-surveymonkey
            source /usr/local/share/virtualenvs/tap-surveymonkey/bin/activate
            uv pip install -U pip setuptools
            uv pip install .[dev]
      - run:
          name: 'pylint'
          command: |
            source /usr/local/share/virtualenvs/tap-surveymonkey/bin/activate
            pylint tap_surveymonkey -d C,R,W
      - run:
          name: 'Unit Tests'
          command: |
            source /usr/local/share/virtualenvs/tap-surveymonkey/bin/activate
            mkdir -p test_output
            pytest --cov=tap_surveymonkey --cov-report=term-missing --junitxml=test_output/unittests.xml tests/unittests
          when: always
      - run:
          name: 'Mocked Integration Tests'
          command: |
            source /usr/local/share/virtualenvs/tap-surveymonkey/bin/activate
            pytest --cov=tap_surveymonkey --cov-report=term-missing --junitxml=test_output/mockedtests.xml tests/mockedtests -v
          when: always
      - run:
          name: 'Coverage Report'
          command: |
            source /usr/local/share/virtualenvs/tap-surveymonkey/bin/activate
            pytest --cov=tap_surveymonkey --cov-report=term-missing --junitxml=test_output/all_tests.xml tests/unittests tests/mockedtests
            coverage html
          when: always
      - store_test_results:
          path: test_output
      - store_artifacts:
          path: htmlcov
      # TODO: Uncomment when credentials are available in CI environment
      # - run:
